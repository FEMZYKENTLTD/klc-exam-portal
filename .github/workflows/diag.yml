name: CI Diagnostics (temporary)
# TEMPORARY diagnostic workflow. The sandbox cannot read GitHub job logs
# (results-receiver is TLS-filtered), so this workflow reproduces the two
# currently-failing CI steps and re-emits the captured error text as
# ::error::/::warning:: workflow commands, which become check-run
# annotations readable through api.github.com. REMOVE AFTER ROOT CAUSES FIXED.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    name: Capture mvn + SQL bootstrap failures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install local Postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql >/dev/null 2>&1
          sudo service postgresql start || sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';" >/dev/null
          sudo -u postgres dropdb --if-exists klcboot
          sudo -u postgres createdb klcboot
          sudo -u postgres psql -d klcboot -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"; CREATE EXTENSION IF NOT EXISTS pgcrypto;' >/dev/null

      - name: Repro full CI migration chain (local Postgres)
        id: sql
        continue-on-error: true
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: klcboot
        run: |
          set +e
          : > sql_boot.log
          # v1_0_social / v1_1 target Supabase-only objects (storage.*,
          # service_role policies); scaffold minimal stand-ins so the whole
          # migrate chain can be executed and validated on plain PostgreSQL.
          psql -v ON_ERROR_STOP=1 <<'EOF' >/dev/null 2>&1
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon')
              THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated')
              THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role')
              THEN CREATE ROLE service_role NOLOGIN; END IF;
          END $$;
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE TABLE IF NOT EXISTS storage.buckets (
            id text PRIMARY KEY, name text, public boolean);
          CREATE TABLE IF NOT EXISTS storage.objects (
            id uuid PRIMARY KEY DEFAULT uuid_generate_v4(),
            bucket_id text, name text, owner uuid);
          EOF
          echo "scaffold_exit=$?" >> sql_boot.log
          for f in supabase/klc_supabase_schema.sql \
                   supabase/klc_supabase_schema_v6_2.sql \
                   supabase/klc_supabase_schema_v6_3_final.sql \
                   supabase/klc_supabase_schema_v1_0_social.sql \
                   supabase/klc_supabase_v1_1_security_and_features.sql; do
            echo "---- $f ----" >> sql_boot.log
            psql -v ON_ERROR_STOP=1 -f "$f" >> sql_boot.log 2>&1
            echo "psql_exit=$?" >> sql_boot.log
          done
          # v1.1 role-CONSTRAINT replacement must accept PARENT and reject junk
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO users(id, full_name, email, password_hash, role) VALUES (uuid_generate_v4(), 'P Tester', 'parent@check.klc', 'x', 'PARENT');" >> sql_boot.log 2>&1
          echo "parent_role_insert_exit=$?" >> sql_boot.log
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO users(id, full_name, email, password_hash, role) VALUES (uuid_generate_v4(), 'X Tester', 'junk@check.klc', 'x', 'HACKER');" >> sql_boot.log 2>&1
          echo "junk_role_rejected_exit=$?" >> sql_boot.log
          tail -n 40 sql_boot.log

      - name: Emit SQL annotations
        if: always()
        run: |
          grep -E "ERROR:|FATAL:" sql_boot.log | head -n 8 | sed 's/^/::error::/' || true
          grep -E "psql_exit|scaffold_exit|role_insert|role_rejected" sql_boot.log | sed 's/^/::warning::/' || true
          tail -n 8 sql_boot.log | sed 's/^/::warning::/' || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: mvn clean package (capture)
        continue-on-error: true
        run: |
          set +e
          mvn -B -ntp clean package > mvn.log 2>&1
          echo "MVN_EXIT=$?" >> mvn.log

      - name: Emit mvn annotations
        if: always()
        run: |
          echo "::error::MVN_EXIT=$(grep MVN_EXIT mvn.log)"
          grep -E "^\[ERROR\]" mvn.log | head -n 8 | sed 's/^/::error::/' || true
          grep -E "Tests run:|BUILD SUCCESS|BUILD FAILURE|No tests" mvn.log | sed 's/^/::warning::/' || true
          tail -n 12 mvn.log | sed 's/^/::warning::/' || true

  remotedb:
    name: Probe + repro remote Supabase bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Resolve DB connection
        id: db
        env:
          HOST: ${{ secrets.KLC_DB_HOST }}
          PORT: ${{ secrets.KLC_DB_PORT }}
          POOLER_URL: ${{ secrets.KLC_DB_POOLER_URL }}
        run: |
          host="${HOST}"; port="${PORT}"
          if { [ -z "$host" ] || [ -z "$port" ]; } && [ -n "$POOLER_URL" ]; then
            case "$POOLER_URL" in
              jdbc:postgresql://*)
                rest="${POOLER_URL#jdbc:postgresql://}"
                [ -n "$host" ] || host="${rest%%:*}"
                if [ -z "$port" ]; then
                  port="${rest#*:}"; port="${port%%/*}"
                fi
                ;;
            esac
          fi
          echo "DB target resolved (host/port not printed)."
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"
      - name: Probe remote DB state
        id: probe
        continue-on-error: true
        env:
          PGHOST: ${{ steps.db.outputs.host }}
          PGPORT: ${{ steps.db.outputs.port }}
          PGUSER: ${{ secrets.KLC_DB_USER }}
          PGPASSWORD: ${{ secrets.KLC_DB_PASS }}
          PGDATABASE: postgres
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '15'
        run: |
          set +e
          psql -tA -c "SELECT to_regclass('public.users') IS NOT NULL;" \
            > users_present.out 2> psql.err
          echo "users_present_query_exit=$?" > remote_probe.log
          cat psql.err >> remote_probe.log
          cat users_present.out >> remote_probe.log
          echo "users_present=$(cat users_present.out 2>/dev/null | head -c 8)" >> "$GITHUB_OUTPUT"
          psql -tA -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';" \
            >> remote_probe.log 2>&1
          echo "table_count_query_exit=$?" >> remote_probe.log
          psql -tA -c "SELECT string_agg(table_name, ', ' ORDER BY table_name) FROM information_schema.tables WHERE table_schema='public';" \
            >> remote_probe.log 2>&1
          echo "tables_query_exit=$?" >> remote_probe.log
          cat remote_probe.log
      - name: Emit remote probe annotations
        if: always()
        run: |
          sed 's/^/::warning::/' remote_probe.log 2>/dev/null || true
      - name: Run bootstrap chain on remote ONLY if users table absent
        id: boot
        if: steps.probe.outputs.users_present == 'f'
        continue-on-error: true
        env:
          PGHOST: ${{ steps.db.outputs.host }}
          PGPORT: ${{ steps.db.outputs.port }}
          PGUSER: ${{ secrets.KLC_DB_USER }}
          PGPASSWORD: ${{ secrets.KLC_DB_PASS }}
          PGDATABASE: postgres
        run: |
          set +e
          USERS=$(psql -tA -c "SELECT to_regclass('public.users') IS NOT NULL;")
          if [ "$USERS" != "t" ]; then
            echo "users absent - running full bootstrap chain" > remote_boot.log
            for f in supabase/klc_supabase_schema.sql \
                     supabase/klc_supabase_schema_v6_2.sql \
                     supabase/klc_supabase_schema_v6_3_final.sql \
                     supabase/klc_supabase_schema_v1_0_social.sql \
                     supabase/klc_supabase_v1_1_security_and_features.sql; do
              echo "---- $f ----" >> remote_boot.log
              psql -v ON_ERROR_STOP=1 -f "$f" >> remote_boot.log 2>&1
              echo "psql_exit=$?" >> remote_boot.log
            done
          else
            echo "users present - bootstrap already applied; not re-running base chain" > remote_boot.log
          fi
          cat remote_boot.log
      - name: Emit remote bootstrap annotations
        if: always()
        run: |
          grep -iE "ERROR:|FATAL:|connection|terminat|pooler|remaining connection" remote_boot.log | head -n 8 | sed 's/^/::error::/' || true
          tail -n 12 remote_boot.log | sed 's/^/::warning::/' || true
