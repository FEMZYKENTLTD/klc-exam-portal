name: Local delivery (artifact courier)

# Build the Linux fat JAR on demand and commit it (split into <100 MB git
# chunks) to the `local-delivery` branch, so a restricted offline sandbox
# that can only reach github.com can fetch a runnable build via plain
# `git fetch` (release-asset/blob CDNs are blocked there).
#
# NOTE: deliberately builds WITHOUT config.properties injection - no secrets
# ever reach the delivery branch. Runners that need config pass their own
# external config.properties (the app merges it via util.AppConfig).

on:
  workflow_dispatch:
  # Push-trigger escape hatch: commit/touch .delivery/trigger on any branch
  # to courier that ref's JAR (used where workflow_dispatch is not
  # permissioned, e.g. restricted CI integrations).
  push:
    paths: ['.delivery/trigger']

permissions:
  contents: write

jobs:
  deliver:
    name: Build Linux fat JAR & courier it via git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build fat JAR (skip tests - the PR gate covers them)
        run: |
          set -o pipefail
          mvn -B -ntp -DskipTests clean package 2>&1 | tee mvn_delivery.log
          tail -c 4000 mvn_delivery.log > delivery_build_tail.txt

      - name: Split JAR into git-safe chunks
        run: |
          JAR=$(ls target/knowledge-land-cbt-*.jar | head -1)
          echo "JAR=$JAR"
          cp "$JAR" delivered.jar
          sha256sum delivered.jar > delivered.sha256
          split -b 48m -d delivered.jar jar.part-
          ls -la jar.part-*

      # The restricted sandbox can only reach github.com, so also courier a
      # JDK 17 + Maven + the resolved dependency cache - enough to run the
      # app headless and iterate on builds locally.
      - name: Courier JDK 17 + Maven + Maven repo cache
        run: |
          set -x
          mkdir -p ship
          mv jar.part-* delivered.sha256 delivery_build_tail.txt ship/
          # Headless glass driver (Monocle) - used only by the offline
          # screenshot harness, never part of the shipped JAR.
          if mvn -B -ntp dependency:get -Dartifact=org.testfx:openjfx-monocle:21.0.2:jar:linux; then
            find ~/.m2/repository/org/testfx -name "*.jar" | head -5
            find ~/.m2/repository/org/testfx -name "*linux*.jar" -exec cp -v {} ship/monocle-linux.jar \;
            echo "monocle: shipped" >> ship/delivery_status.txt
          else
            echo "monocle: RESOLUTION FAILED (harness will lack headless glass)" >> ship/delivery_status.txt
          fi
          mkdir -p bundle && cd bundle
          curl -fsSL -o jdk.tar.gz "https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jdk/hotspot/normal/eclipse" \
            || curl -fsSL -o jdk.tar.gz "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.13%2B11/OpenJDK17U-jdk_x64_linux_hotspot_17.0.13_11.tar.gz"
          curl -fsSL -o maven.tar.gz "https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz"
          tar czf m2repo.tar.gz -C "$HOME" .m2/repository
          for f in jdk.tar.gz maven.tar.gz m2repo.tar.gz; do
            sha256sum "$f" >> ../ship/delivered.sha256
            split -b 48m -d "$f" "../ship/${f%.tar.gz}.tgz.part-"
          done
          cd ..
          ls -la ship | tee -a ship/delivery_status.txt | head -20

      - name: Push chunks to local-delivery branch
        run: |
          git config user.name  "klc-delivery-bot"
          git config user.email "actions@github.com"
          git checkout --orphan tmp-delivery
          git rm -rf --cached . -q || true
          rm -rf src supabase docs tools klc-web-admin .github target bundle
          git add -A ship/
          git commit -m "delivery: fat JAR + JDK17 + Maven + m2 cache $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin tmp-delivery:local-delivery
          echo "Pushed to local-delivery."
