# KLC CBT Suite - TEST-ONLY configuration.
# This file SHADOWS src/main/resources/config.properties on the Maven test
# classpath so automated tests run fully against an in-memory H2 database
# (PostgreSQL compatibility mode) - never the real cloud.

supabase.url=
supabase.key=
supabase.storage.bucket=klc-attachments
supabase.db.url=
supabase.db.user=postgres
supabase.db.password=
supabase.db.pooler.url=
supabase.db.pooler.user=
supabase.db.pooler.password=

# Deterministic registration codes for tests
code.super_admin=TEST-SUPERADMIN-CODE
code.admin=TEST-STAFF-CODE
code.student=TEST-FAMILY-CODE

# Fixed first-boot password for the seeded H2 super admin (tests only)
app.superadmin.password=TestSuperAdminPass1

proctor.webcam=false
proctor.allowed_ips=
backup.key=

social.allow_student_staff_dm=false
social.allow_student_attachments=false

# In-memory H2 (PostgreSQL compatibility mode), kept alive for the JVM
h2.url=jdbc:h2:mem:klctest;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE;MODE=PostgreSQL
h2.user=sa
h2.password=

smtp.host=
smtp.port=
smtp.user=
smtp.pass=
smtp.from.name=
smtp.from.email=
